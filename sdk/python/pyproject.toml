[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-sdk"
version = "0.2.1"
description = "Python SDK for Grain — a structured data format for describing AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["grain*"]

[tool.setuptools.package-data]
grain = ["schema.json"]
